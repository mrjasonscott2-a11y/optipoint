<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiPoint - Planning</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon"><i class="fas fa-fingerprint"></i></div>
            <div class="logo-text">Opti<span>Point</span></div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">Administration</div>
            <a href="admin.html" class="nav-item"><i class="fas fa-tachometer-alt"></i> Tableau de bord</a>
            <a href="admin-employes.html" class="nav-item"><i class="fas fa-users"></i> Employés</a>
            <a href="admin-pointages.html" class="nav-item"><i class="fas fa-clock"></i> Pointages</a>
            <a href="admin-planning.html" class="nav-item active"><i class="fas fa-calendar-alt"></i> Planning</a>
            <a href="admin-rapports.html" class="nav-item"><i class="fas fa-chart-bar"></i> Rapports</a>
            <a href="admin-parametres.html" class="nav-item"><i class="fas fa-cog"></i> Paramètres</a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="user-avatar" id="user-avatar">AD</div>
                <div class="user-info">
                    <div class="user-name" id="user-name">Admin</div>
                    <div class="user-role" id="user-role">Administrateur</div>
                </div>
            </div>
        </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="main-content">
        <header class="dashboard-header">
            <div class="header-left">
                <button class="sidebar-toggle" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
                <div>
                    <div class="breadcrumb">
                        <span>Administration</span><span class="separator">/</span>
                        <span class="current">Planning</span>
                    </div>
                    <h1>Gestion du Planning</h1>
                </div>
            </div>
            <div class="header-right">
                <div class="header-date"><i class="fas fa-calendar-day"></i> <span id="header-date">--</span></div>
                <button class="btn btn-primary" id="btn-add">
                    <i class="fas fa-plus"></i> Nouvelle affectation
                </button>
                <button class="btn-icon-header" id="logout-btn" data-tooltip="Déconnexion">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <main class="page-content">
            <div class="data-card">
                <div class="table-header">
                    <h3><i class="fas fa-calendar-alt"></i> Plannings en cours</h3>
                    <div class="table-header-actions">
                        <input type="date" id="filter-debut" class="filter-select">
                        <input type="date" id="filter-fin" class="filter-select">
                        <button class="btn btn-sm btn-primary" id="btn-filter"><i class="fas fa-filter"></i> Filtrer</button>
                    </div>
                </div>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Employé</th>
                                <th>Période</th>
                                <th>Horaires</th>
                                <th>Description</th>
                                <th>Lieu</th>
                                <th>Type</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="plannings-tbody">
                            <tr><td colspan="7" class="text-center text-muted">Chargement...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination" id="pagination"></div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="planning-modal">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h3><i class="fas fa-calendar-plus"></i> <span id="modal-title">Nouvelle affectation</span></h3>
                <button class="modal-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="planning-form">
                    <input type="hidden" id="form-id">
                    <div class="form-group">
                        <label>Employé *</label>
                        <select id="form-utilisateur" class="form-control" required></select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Date début *</label>
                            <input type="date" id="form-date-debut" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Date fin *</label>
                            <input type="date" id="form-date-fin" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Heure début</label>
                            <input type="time" id="form-heure-debut" class="form-control" value="08:00">
                        </div>
                        <div class="form-group">
                            <label>Heure fin</label>
                            <input type="time" id="form-heure-fin" class="form-control" value="17:00">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Type d'activité</label>
                            <select id="form-type" class="form-control">
                                <option value="bureau">Bureau</option>
                                <option value="teletravail">Télétravail</option>
                                <option value="client">Client</option>
                                <option value="mission">Mission</option>
                                <option value="absence">Absence</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Lieu</label>
                            <input type="text" id="form-lieu" class="form-control" placeholder="Bureau principal">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Description *</label>
                        <textarea id="form-description" class="form-control" rows="2" placeholder="Description de l'affectation" required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary modal-close">Annuler</button>
                <button class="btn btn-primary" id="btn-save"><i class="fas fa-save"></i> Enregistrer</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/admin-planning.js"></script>
</body>
</html>
