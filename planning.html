<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiPoint - Mon Planning</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon"><i class="fas fa-fingerprint"></i></div>
            <div class="logo-text">Opti<span>Point</span></div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">Employé</div>
            <a href="dashboard.html" class="nav-item"><i class="fas fa-tachometer-alt"></i> Accueil</a>
            <a href="pointage.html" class="nav-item"><i class="fas fa-clock"></i> Pointer</a>
            <a href="planning.html" class="nav-item active"><i class="fas fa-calendar-alt"></i> Mon planning</a>
            <a href="rapport.html" class="nav-item"><i class="fas fa-chart-bar"></i> Mes rapports</a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="user-avatar" id="user-avatar">EM</div>
                <div class="user-info">
                    <div class="user-name" id="user-name">Employé</div>
                    <div class="user-role" id="user-role">Collaborateur</div>
                </div>
            </div>
        </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="main-content">
        <header class="dashboard-header">
            <div class="header-left">
                <button class="sidebar-toggle" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
                <div>
                    <div class="breadcrumb"><span>Employé</span><span class="separator">/</span><span class="current">Mon planning</span></div>
                    <h1>Mon Planning</h1>
                </div>
            </div>
            <div class="header-right">
                <div class="header-date"><i class="fas fa-calendar-day"></i> <span id="header-date">--</span></div>
                <button class="btn-icon-header" id="logout-btn" data-tooltip="Déconnexion"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>

        <main class="page-content">
            <div class="card">
                <div class="card-header"><h3><i class="fas fa-filter"></i> Période</h3></div>
                <div class="card-body">
                    <div class="toolbar">
                        <input type="date" id="filter-debut" class="form-control">
                        <input type="date" id="filter-fin" class="form-control">
                        <button class="btn btn-primary" id="btn-filter"><i class="fas fa-search"></i> Afficher</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><h3><i class="fas fa-calendar-week"></i> Mes plannings</h3></div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead><tr><th>Date début</th><th>Date fin</th><th>Heures</th><th>Description</th><th>Type</th><th>Lieu</th></tr></thead>
                            <tbody id="planning-tbody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toast-container"></div>
    <script src="js/app.js"></script>
    <script src="js/planning.js"></script>
</body>
</html>
